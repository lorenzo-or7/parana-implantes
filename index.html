<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paraná Implantes · Clínica odontológica em Curitiba (protótipo)</title>
    <meta
      name="description"
      content="Protótipo demonstrativo do site da Paraná Implantes, clínica odontológica no Novo Mundo, Curitiba, desde 2014."
    />
    <!-- Protótipo: não indexar até a aprovação do domínio oficial. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFF3E7" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=plus-jakarta-sans@400&f[]=zodiak@700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="./assets/clinica/recepcao_principal_hero.webp" fetchpriority="high" />
    <script>
      // Define o tema antes da primeira pintura para evitar flash.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('pi-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#2A1A0E' : '#FFF3E7');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
